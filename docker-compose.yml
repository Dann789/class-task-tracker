version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: class_task_tracker_db
    restart: always
    environment:
      POSTGRES_DB: tasktracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: class_task_tracker_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tasktracker_db
      DB_USER: postgres
      DB_PASSWORD: "123456"
      JWT_SECRET: class_task_tracker_secret_key_jwt_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: class_task_tracker_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
